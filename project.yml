name: NullView
options:
  bundleIdPrefix: com.nullview
  deploymentTarget:
    iOS: "26.0"
packages:
  SafariConverterLib:
    url: https://github.com/AdguardTeam/SafariConverterLib
    exactVersion: 4.3.1
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0 # app-only: needs a system SQLite, so it cannot live in Core (builds on the runner only)
  NullViewCore:
    path: Core
targets:
  NullView:
    type: application
    platform: iOS
    sources:
      - NullView
      - path: js/dist/adblock-content.js # built by CI (js job) or `cd js && npm run build`
        buildPhase: resources
      - path: js/src/video-detect.js # injected as-is into the isolated content world
        buildPhase: resources
      - path: js/src/element-picker.js # evaluated on demand in its own content world (hide an element)
        buildPhase: resources
      - path: js/src/fullscreen-hook.js # injected as-is into the page world (fullscreen requests -> DOM event)
        buildPhase: resources
    dependencies:
      - package: NullViewCore
      - package: GRDB
        product: GRDB
      - package: SafariConverterLib
        product: ContentBlockerConverter # also contains the FilterEngine module
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nullview.app
        SWIFT_VERSION: "5.0" # avoid Swift 6 strict-concurrency errors; we can't compile locally
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0" # CI overrides both with the run number
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: NullView/Info.plist
      properties:
        CFBundleDisplayName: Null View
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.nullview.app
            CFBundleURLSchemes: [nullview]
