<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15181C"/>
      <stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <linearGradient id="slash" gradientUnits="userSpaceOnUse" x1="124" y1="388" x2="388" y2="124">
      <stop offset="0" stop-color="#5FD08A"/>
      <stop offset="1" stop-color="#E4F77E"/>
