<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A1F"/>
      <stop offset="1" stop-color="#0B0B0E"/>
    </linearGradient>
    <linearGradient id="slash" gradientUnits="userSpaceOnUse" x1="118" y1="394" x2="394" y2="118">
      <stop offset="0" stop-color="#FF8A4C"/>
      <stop offset="1" stop-color="#FF3D6E"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <line x1="118" y1="394" x2="394" y2="118" stroke="#000" stroke-width="96" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect id="background" width="512" height="512" fill="url(#bg)"/>
  <g id="icon">
    <circle cx="256" cy="256" r="140" fill="none" stroke="#F5F2EC" stroke-width="56" mask="url(#cut)"/>
